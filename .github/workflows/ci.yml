name: PolicyPilot NZ CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  backend-checks:
    name: Backend Unit & Regression Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python compilation
        run: |
          python -m compileall app/ tests/

      - name: Run automated test suite
        env:
          PYTHONPATH: "."
          GEMINI_API_KEY: "mock_ci_key"
        run: |
          pytest -v

  frontend-checks:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build for production
        env:
          VITE_API_BASE_URL: "https://policy-pilot-nz.onrender.com"
        run: npm run build

  security-scan:
    name: Secret & Credential Leak Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify no tracked secrets or .env files
        run: |
          LEAKED=$(git ls-files | grep -iE '(^|/)\.env($|\.)|\.secret$' || true)
          if [ -n "$LEAKED" ]; then
            echo "ERROR: Tracked secrets or environment files detected:"
            echo "$LEAKED"
            exit 1
          fi
          echo "Secret check passed: zero tracked environment files."
